<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BappyGPT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #faf9f5;
  --sidebar: #f5f4ed;
  --panel: #ffffff;
  --text: #1f1e1d;
  --muted: #73726c;
  --border: #e5e3da;
  --hover: #ebe9df;
  --accent: #d97757;
  --accent-text: #ffffff;
  --user-bubble: #efede4;
  --code-bg: #f0eee6;
  --shadow: 0 2px 14px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #262624;
    --sidebar: #1f1e1d;
    --panel: #30302e;
    --text: #f1efe8;
    --muted: #a09f98;
    --border: #3e3d3a;
    --hover: #2c2b29;
    --user-bubble: #3a3936;
    --code-bg: #1c1b1a;
    --shadow: 0 2px 14px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  font-size: 15px; display: flex; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }

/* ---------- Sidebar ---------- */
#sidebar {
  width: 280px; flex-shrink: 0; background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 12px 10px;
  transition: margin-left .2s;
}
#sidebar.closed { margin-left: -280px; }
.side-top { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 10px; }
.brand { font-family: ui-serif, Georgia, serif; font-size: 20px; font-weight: 500; padding-left: 6px; }
.icon-btn { padding: 6px 8px; border-radius: 8px; color: var(--muted); line-height: 1; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
#newChat {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border-radius: 10px; font-weight: 500; text-align: left;
}
#newChat:hover { background: var(--hover); }
#newChat .plus {
  width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
  color: var(--accent-text); display: grid; place-items: center; font-size: 16px; line-height: 1;
}
.side-label { color: var(--muted); font-size: 12px; padding: 16px 12px 6px; }
#convList { overflow-y: auto; flex: 1; }
.conv {
  display: block; width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.conv:hover { background: var(--hover); }
.conv.active { background: var(--hover); font-weight: 500; }
.side-user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--border); }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--hover);
  display: grid; place-items: center; font-size: 13px; font-weight: 600;
}

/* ---------- Main ---------- */
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
#topbar { display: flex; align-items: center; padding: 10px 14px; height: 52px; }
#openSide { display: none; }
#sidebar.closed ~ #main #openSide { display: inline-block; }

#chat { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.column { max-width: 760px; margin: 0 auto; padding: 0 20px; }
#messages { padding-top: 10px; padding-bottom: 24px; }
.msg { margin: 18px 0; display: flex; }
.msg.user { justify-content: flex-end; }
.msg.user .body {
  background: var(--user-bubble); padding: 10px 16px; border-radius: 18px;
  max-width: 85%; white-space: pre-wrap; word-wrap: break-word;
}
.msg.assistant .body { width: 100%; line-height: 1.7; font-size: 15.5px; word-wrap: break-word; }
.msg.assistant .body > :first-child { margin-top: 0; }
.msg.assistant .body pre {
  background: var(--code-bg); padding: 14px 16px; border-radius: 10px; overflow-x: auto; font-size: 13.5px;
}
.msg.assistant .body code { background: var(--code-bg); padding: 2px 5px; border-radius: 5px; font-size: 13.5px; }
.msg.assistant .body pre code { background: none; padding: 0; }
.msg.assistant .body table { border-collapse: collapse; }
.msg.assistant .body th, .msg.assistant .body td { border: 1px solid var(--border); padding: 6px 10px; }
.msg.assistant .body a { color: var(--accent); }
.msg.error .body { color: #c0392b; }
.note {
  margin: 12px auto; width: fit-content; font-size: 13px; color: var(--muted);
  background: var(--sidebar); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
}
.dots span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%;
  background: var(--muted); animation: blink 1.2s infinite both; }
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

/* ---------- Greeting (empty state) ---------- */
#greeting { text-align: center; padding-bottom: 28px; }
#greeting h1 {
  font-family: ui-serif, Georgia, "Times New Roman", serif;
  font-weight: 400; font-size: 40px; margin: 0; letter-spacing: -.5px;
}
#greeting .star { color: var(--accent); margin-right: 10px; }

/* ---------- Composer ---------- */
#dock { padding: 0 20px 20px; }
body.empty #dock {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  justify-content: center; align-items: center; padding-bottom: 8vh; pointer-events: none;
}
body.empty #dock > * { pointer-events: auto; }
body:not(.empty) #greeting { display: none; }
body.empty #chat { display: none; }
#composer {
  width: 100%; max-width: 760px; margin: 0 auto; background: var(--panel);
  border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow);
  padding: 14px 14px 10px;
}
#composer:focus-within { border-color: var(--muted); }
#input {
  width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
  font: inherit; font-size: 16px; line-height: 1.5; max-height: 220px; padding: 2px 6px;
}
.bar { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.bar .spacer { flex: 1; }
#model {
  background: transparent; color: var(--muted); border: 0; font: inherit; font-size: 13.5px;
  cursor: pointer; outline: 0; padding: 6px 4px; border-radius: 8px;
}
#model:hover { background: var(--hover); }
#send {
  width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-text);
  display: grid; place-items: center; font-size: 17px;
}
#send:disabled { opacity: .35; cursor: default; }
.hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
body.empty .hint { display: none; }

@media (max-width: 760px) {
  #sidebar { position: fixed; z-index: 10; height: 100%; box-shadow: var(--shadow); }
  #greeting h1 { font-size: 30px; }
}
</style>
</head>
<body class="empty">

<aside id="sidebar">
  <div class="side-top">
    <span class="brand">BappyGPT</span>
    <button class="icon-btn" id="closeSide" title="Thu gọn">&#9776;</button>
  </div>
  <button id="newChat"><span class="plus">+</span> Cuộc trò chuyện mới</button>
  <div class="side-label">Gần đây</div>
  <div id="convList"></div>
  <div class="side-user"><div class="avatar" id="avatar"></div><span id="userName"></span></div>
</aside>

<section id="main">
  <div id="topbar"><button class="icon-btn" id="openSide" title="Mở thanh bên">&#9776;</button></div>

  <div id="chat">
    <div class="column"><div id="messages"></div></div>
  </div>

  <div id="dock">
    <div id="greeting"><h1><span class="star">&#10035;</span><span id="greetText"></span></h1></div>
    <form id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Bạn cần mình giúp gì hôm nay?"></textarea>
      <div class="bar">
        <button type="button" class="icon-btn" id="attach" title="Đính kèm tài liệu (PDF, DOCX, TXT, MD, PY, CSV)">&#43;</button>
        <input type="file" id="file" hidden accept=".pdf,.docx,.txt,.md,.py,.csv">
        <span class="spacer"></span>
        <select id="model" title="Chọn model">
          <option value="google/gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="google/gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="google/gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
        </select>
        <button type="submit" id="send" title="Gửi" disabled>&#8593;</button>
      </div>
    </form>
    <div class="hint">BappyGPT có thể mắc lỗi. Hãy kiểm tra lại thông tin quan trọng.</div>
  </div>
</section>

<script>
const USER_NAME = "walt";
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages"), chatEl = $("chat"), inputEl = $("input"), sendBtn = $("send");

let threadId = crypto.randomUUID();
let busy = false;

/* ---------- helpers ---------- */
function render(md) {
  return DOMPurify.sanitize(marked.parse(md || "", { breaks: true }));
}
function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }
function setEmpty(v) { document.body.classList.toggle("empty", v); }
function greeting() {
  const h = new Date().getHours();
  const part = h < 12 ? "Chào buổi sáng" : h < 18 ? "Chào buổi chiều" : "Chào buổi tối";
  $("greetText").textContent = `${part}, ${USER_NAME}`;
}
function addMessage(role, content) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const body = document.createElement("div");
  body.className = "body";
  if (role === "assistant") body.innerHTML = render(content);
  else body.textContent = content;
  wrap.appendChild(body);
  messagesEl.appendChild(wrap);
  return body;
}
function addNote(text) {
  const n = document.createElement("div");
  n.className = "note"; n.textContent = text;
  messagesEl.appendChild(n); scrollDown();
}

/* ---------- conversations ---------- */
async function loadConversations() {
  try {
    const res = await fetch("/conversations");
    const { conversations } = await res.json();
    const list = $("convList");
    list.innerHTML = "";
    for (const c of conversations) {
      const b = document.createElement("button");
      b.className = "conv" + (c.thread_id === threadId ? " active" : "");
      b.textContent = c.title || "New Chat";
      b.title = c.title || "";
      b.onclick = () => openConversation(c.thread_id);
      list.appendChild(b);
    }
  } catch (e) { /* sidebar is optional */ }
}
async function openConversation(id) {
  if (busy) return;
  threadId = id;
  messagesEl.innerHTML = "";
  const res = await fetch("/history/" + encodeURIComponent(id));
  const { messages } = await res.json();
  for (const m of messages) addMessage(m.role === "user" ? "user" : "assistant", m.content);
  setEmpty(messages.length === 0);
  scrollDown();
  loadConversations();
}
function newChat() {
  if (busy) return;
  threadId = crypto.randomUUID();
  messagesEl.innerHTML = "";
  setEmpty(true);
  greeting();
  inputEl.focus();
  loadConversations();
}

/* ---------- send / stream ---------- */
async function send(text) {
  busy = true; sendBtn.disabled = true;
  setEmpty(false);
  addMessage("user", text);

  const body = addMessage("assistant", "");
  body.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
  scrollDown();

  let answer = "";
  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: threadId, model: $("model").value })
    });
    if (!res.ok || !res.body) throw new Error("Server trả về lỗi " + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        if (!part.startsWith("data:")) continue;
        const data = JSON.parse(part.slice(5).trim());
        if (data.token) {
          answer += data.token;
          body.innerHTML = render(answer);
          scrollDown();
        }
        if (data.error) {
          body.parentElement.classList.add("error");
          body.textContent = (answer ? answer + "\n\n" : "") + "Lỗi: " + data.error;
        }
      }
    }
    if (!answer && !body.parentElement.classList.contains("error")) body.textContent = "(Không có phản hồi)";
  } catch (e) {
    body.parentElement.classList.add("error");
    body.textContent = "Lỗi: " + e.message;
  } finally {
    busy = false; sendBtn.disabled = !inputEl.value.trim();
    loadConversations();
    inputEl.focus();
  }
}

/* ---------- upload ---------- */
async function upload(file) {
  setEmpty(false);
  addNote("Đang tải lên " + file.name + " ...");
  const fd = new FormData();
  fd.append("file", file);
  fd.append("thread_id", threadId);
  try {
    const res = await fetch("/upload", { method: "POST", body: fd });
    const data = await res.json();
    addNote(data.message);
  } catch (e) {
    addNote("Tải lên thất bại: " + e.message);
  }
  loadConversations();
}

/* ---------- events ---------- */
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = inputEl.scrollHeight + "px";
  sendBtn.disabled = busy || !inputEl.value.trim();
});
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || busy) return;
  inputEl.value = ""; inputEl.style.height = "auto";
  send(text);
});
$("attach").onclick = () => $("file").click();
$("file").onchange = (e) => {
  const f = e.target.files[0];
  if (f) upload(f);
  e.target.value = "";
};
$("newChat").onclick = newChat;
$("closeSide").onclick = () => $("sidebar").classList.add("closed");
$("openSide").onclick = () => $("sidebar").classList.remove("closed");

$("userName").textContent = USER_NAME;
$("avatar").textContent = USER_NAME[0].toUpperCase();
greeting();
loadConversations();
inputEl.focus();
</script>
</body>
</html>
